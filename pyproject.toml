[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython>=3.0", "numpy>=1.12.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vsm"
version = "1.0.0b1"
description = "Vector Space Semantic Modeling Framework for the Indiana Philosophy Ontology Project"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "The Indiana Philosophy Ontology (InPhO) Project", email = "inpho@indiana.edu"}
]
license = {text = "MIT"}
keywords = ["semantic", "modeling", "philosophy", "ontology"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "chardet",
    # cython is imported at runtime by vsm/model/ldacgsmulti.py, so it is a
    # runtime dependency as well as a build requirement (see build-system).
    "cython",
    "future",
    "matplotlib",
    "nltk",
    "numpy",
    "progressbar2",
    "py4j",
    "scikit-learn",
    "scipy",
    "sortedcontainers",
    "translate",
    "Unidecode",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["vsm*"]

[tool.setuptools.package-data]
vsm = ["vsm/model/_cgs_update.pyx"]

[dependency-groups]
dev = ["pytest"]
